# Quick scenario test - climate scenario with fewer agents/rounds
experiment_name: "quick_scenario_test"
output_dir: "results"
num_games: 1

scenario:
  id: "climate_cooperation"

default_provider:
  type: openrouter
  api_key: "${OPENROUTER_API_KEY}"
  temperature: 1.0

game:
  num_rounds: 10    
  team_size: 5       
  multipliers:
    5: 3
    8: 5
    10: 10
  seed: 42

team_a:
  size: 5
  provider:
    type: openrouter
    model: "thudm/glm-4.1v-9b-thinking"
    temperature: 1.0  # Add this
    api_key: "${OPENROUTER_API_KEY}"

team_b:
  size: 5
  provider:
    type: openrouter
    model: "qwen/qwen3-14b"
    temperature: 1.0  # Add this
    api_key: "${OPENROUTER_API_KEY}"
